PYGBAG_FS=1

__import__('os').chdir(__import__('tempfile').gettempdir())
def fs_decode(fsname, o248):
    from pathlib import Path
    filename = Path.cwd() / fsname
    if not filename.is_file():
        filename.parent.mkdir(parents=True, exist_ok=True)
        with open(fsname,"wb") as fs:
            for input in o248.split("\n"):
                if not input: continue
                fs.write(bytes([ord(c) - 248 for c in input]))

# fmt:on
del fs_decode, PYGBAG_FS
import asyncio

# Initialize pygame
pygame.init()

# Create window (800x500)
screen = pygame.display.set_mode((800, 500))
pygame.display.set_caption("Visual Indicators")

# Set initial values
fuel = 80
oxygen = 90

# Print completion message (required for test cases)
print("Visual indicators drawn")

# Game loop (required for Pygbag to display graphics)
async def main():
    clock = pygame.time.Clock()
    frames = 0
    max_frames = 180  # Run for 3 seconds at 60 FPS
    
    while frames < max_frames:
        # Handle events
        for event in pygame.event.get():
            if event.type == pygame.QUIT:
                return
        
        # Fill background with black
        screen.fill((0, 0, 0))
        
        # Draw fuel bar
        # Position: (50, 450), Green color: (0, 255, 0), Width: fuel * 2, Height: 20
        pygame.draw.rect(screen, (0, 255, 0), (50, 450, fuel * 2, 20))
        
        # Draw oxygen bar
        # Position: (50, 480), Blue color: (0, 0, 255), Width: oxygen * 2, Height: 20
        pygame.draw.rect(screen, (0, 0, 255), (50, 480, oxygen * 2, 20))
        
        # Update display
        pygame.display.flip()
        
        # Yield control back to browser (required for Pygbag)
        await asyncio.sleep(0)
        
        clock.tick(60)
        frames += 1

# Run the async main loop

asyncio.run(main())
